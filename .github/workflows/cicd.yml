name: Deploy IAO Belgium Frontend to AWS Lightsail

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # 3️⃣ Install deps & build (IMPORTANT PART)
      - name: Install Dependencies and Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      # 4️⃣ Rename dist (optional but matches your standard)
      - name: Rename dist folder
        run: |
          cd frontend
          mv dist iao-belgium

      # 5️⃣ Prepare temp directory on Lightsail
      - name: Prepare Lightsail temp directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            rm -rf ~/deploy-temp
            mkdir -p ~/deploy-temp
            chmod 775 ~/deploy-temp

      # 6️⃣ Upload build using rsync
      - name: Upload build to Lightsail
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete
          path: frontend/iao-belgium/
          remote_path: ~/deploy-temp/
          remote_host: ${{ secrets.LIGHTSAIL_HOST }}
          remote_user: ${{ secrets.LIGHTSAIL_USER }}
          remote_key: ${{ secrets.LIGHTSAIL_KEY }}

      # 7️⃣ Deploy to Nginx web root
      - name: Deploy to Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            sudo rm -rf /var/www/html/iao-belgium
            sudo mkdir -p /var/www/html/iao-belgium
            sudo cp -R ~/deploy-temp/* /var/www/html/iao-belgium
            sudo chown -R www-data:www-data /var/www/html/iao-belgium
            sudo chmod -R 755 /var/www/html/iao-belgium
            rm -rf ~/deploy-temp

            sudo rm -rf /var/cache/nginx/*
            sudo systemctl restart nginx

            echo "✅ Frontend deployment completed!"
